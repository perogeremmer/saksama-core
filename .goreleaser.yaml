# Release configuration. One static binary per platform, no CGO, no runtime
# dependencies, so "install one file" in the README is literally true.
version: 2

project_name: saksama

before:
  hooks:
    - go mod tidy

builds:
  - id: saksama
    main: ./cmd/saksama
    binary: saksama
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/perogeremmer/saksama-core/internal/cli.Version={{ .Version }}
    # Linux only. saksama runs the copy on the machine next to the database, and
    # darwin was published for four releases without a single run: no CI runner
    # ever executed it, and outside Linux the /proc pid-identity check behind
    # cancel and retire does not exist. An artifact nobody has run is a claim, and
    # this release page should only carry what the repository can defend.
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The binary and its licence. Documentation is deliberately not bundled: a
    # README inside a tarball is a snapshot of the day the tag was cut, so every
    # correction to it needs a new release - and this repository has now paid that
    # bill twice (v0.2.0 shipped a stale README, v0.3.0 shipped one written before
    # the production-install section existed). The documents live in the repository
    # at the tag, which is where a reader looks first anyway.
    #
    # LICENSE stays: MIT asks for the notice to travel with the binary.
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

# goreleaser v2 spells this "sboms" and shells out to syft. The key here used to be
# "sbom" with two bare words, which is not a field in v2 at all: the release job
# failed instantly on an unmarshal error and published nothing.
sboms:
  - artifacts: archive

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Documentation
      regexp: '^docs'
      order: 2
    - title: Other
      order: 999

release:
  draft: false
  prerelease: auto
  # A tag can be replaced - the annotation was wrong, the run before it published
  # nothing, a CVE fix has to ship under the same number. With the default mode a
  # second run fails on every upload with "422 already_exists" and leaves a red
  # workflow next to a release page that is actually fine. Replacing the assets makes
  # re-releasing the tag it claims to be.
  mode: replace
  footer: |
    ### Verified combinations

    See [docs/COMPATIBILITY.md](https://github.com/perogeremmer/saksama-core/blob/master/docs/COMPATIBILITY.md).
    A row marked "yes" means a test in this repository ran against it.

    ### Install

    ```bash
    go install github.com/perogeremmer/saksama-core/cmd/saksama@{{ .Tag }}
    ```
