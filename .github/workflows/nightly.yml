name: Nightly

# The tests that are too slow, or too dependent on the machine, for every pull
# request. They exist because the claims they cover are the ones that hurt when
# they are wrong: a copy that loses a committed write, or a copy that ignores the
# load ceiling it was given.
on:
  schedule:
    # 18:00 UTC is 01:00 in Jakarta: the quiet hour for whoever reads the failure.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  volume:
    name: Volume and concurrency (200k rows, live writes)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A 16 MB buffer pool for a 130k-row table means the copy does real I/O
      # instead of fitting in memory and finishing before the writer can race it.
      - name: Start MySQL with a buffer pool that makes the copy work
        run: |
          docker run -d --name mysql-volume \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=1 \
            -e MYSQL_DATABASE=shop \
            -p 127.0.0.1::3306 mysql:8.0 --skip-ssl \
            --innodb-buffer-pool-size=24M
          for i in $(seq 1 90); do
            if docker exec mysql-volume mysql -h127.0.0.1 -P3306 -uroot --silent -e "SELECT 1" >/dev/null 2>&1; then
              port=$(docker port mysql-volume 3306/tcp | head -1 | sed 's/.*://')
              echo "ready on host port ${port}"
              echo "PORT_VOLUME=${port}" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"; exit 1

      # gh-ost is the engine the ladder reaches for first, so it is the one worth
      # holding to the no-lost-writes claim.
      - name: Download gh-ost 1.1.11
        run: |
          curl -fsSL -o /tmp/gh-ost.tgz \
            https://github.com/github/gh-ost/releases/download/v1.1.11/gh-ost-linux-amd64.tar.gz
          mkdir -p /tmp/ghost && tar xzf /tmp/gh-ost.tgz -C /tmp/ghost
          chmod +x /tmp/ghost/gh-ost
          /tmp/ghost/gh-ost --version

      - name: A copy under live writes loses nothing and respects the load ceiling
        env:
          SAKSAMA_VOLUME_TESTS: "1"
          PATH: /tmp/ghost:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          SAKSAMA_TEST_DSN="root:@tcp(127.0.0.1:${PORT_VOLUME})/" \
            go test -tags=integration -count=1 -timeout 30m -v \
              -run 'TestCopyWithConcurrentWrites' ./test/integration/

      - name: Container logs when it fails
        if: failure()
        run: docker logs mysql-volume --tail 100 || true

  # The parser is the gate the analyzer trusts: whatever it returns becomes a rule
  # verdict, and a verdict becomes an ALTER on a production table. Examples cover
  # the inputs we thought of; this looks for the ones we did not. It found nine
  # boundary bugs on the first run, including a panic on a truncated PRIMARY clause.
  #
  # Bounded on purpose: a fuzzer with no time limit is a job that either never ends
  # or ends whenever the scheduler says. Both targets get the same window, and a
  # failure here mails the crasher, which is committed to testdata/fuzz so the next
  # run starts from it.
  fuzz-parser:
    name: Fuzz the SQL parser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz ParseAlter
        run: go test ./internal/parser/ -run=XXX -fuzz=FuzzParseAlter -fuzztime=90s

      - name: Fuzz ParseCreateTable
        run: go test ./internal/parser/ -run=XXX -fuzz=FuzzParseCreateTable -fuzztime=90s

      - name: Upload anything the fuzzer found
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: internal/parser/testdata/fuzz/**
          retention-days: 7

  # The only test that runs a migration at a size the product is written for. The
  # rest of the suite is fixture-sized: the volume job copies about 13 MiB, which
  # proves the engine loses nothing but proves nothing about minutes of work.
  #
  # What it adds: the held cutover really waits; the swap preserves every committed
  # write; cleanup returns the disk (_t_del, measured before and after); the next
  # plan quotes the throughput this run measured; the event log stays in kilobytes;
  # reconcile comes back empty.
  #
  # 2 GiB with 1 KiB rows is a multi-minute copy for gh-ost, and the disk budget is
  # roughly three times the table - the copy, its ghost table, and the binary log the
  # copy itself generates all land in the same volume. Raise SAKSAMA_SCALE_GB on a
  # bigger machine; D13's 8 GiB threshold is covered by unit test, not here.
  scale:
    name: Production-shape copy (held cutover, live writes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Disk budget, said out loud
        run: df -h / | tail -1

      - name: Start MySQL with binary logging
        run: |
          # The server trades durability for speed, and says so: sync_binlog=0 and
          # flush_log_at_trx_commit=2 make the fixture build minutes rather than the
          # forty it took with the defaults. This job tests the COPY, not the server's
          # crash safety - the recovery tests own that, and they run with defaults.
          docker run -d --name mysql-scale \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=1 \
            -e MYSQL_DATABASE=shop \
            -p 127.0.0.1::3306 mysql:8.4 \
            --log-bin=mysql-bin --server-id=1 --binlog-format=ROW \
            --binlog-row-image=FULL \
            --innodb-buffer-pool-size=1G \
            --innodb-flush-log-at-trx-commit=2 \
            --sync-binlog=0 \
            --max-connections=200
          for i in $(seq 1 90); do
            if docker exec mysql-scale mysql -h127.0.0.1 -P3306 -uroot --silent -e "SELECT 1" >/dev/null 2>&1; then
              port=$(docker port mysql-scale 3306/tcp | head -1 | sed 's/.*://')
              echo "ready on host port ${port}"
              echo "SAKSAMA_TEST_DSN=root:@tcp(127.0.0.1:${port})/" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"; exit 1

      - name: Download gh-ost 1.1.11
        run: |
          curl -fsSL -o /tmp/gh-ost.tgz \
            https://github.com/github/gh-ost/releases/download/v1.1.11/gh-ost-linux-amd64.tar.gz
          mkdir -p /tmp/ghost && tar xzf /tmp/gh-ost.tgz -C /tmp/ghost
          chmod +x /tmp/ghost/gh-ost
          /tmp/ghost/gh-ost --version

      - name: The copy, held at the gate, under live writes
        env:
          SAKSAMA_SCALE_TESTS: "1"
          # 1 GiB, not the test's own 2 GiB default: the peak on disk is roughly five
          # times the table (table, ghost copy, the kept _t_del, and the binary log
          # the copy itself writes), and a hosted runner has about 14 GB. It is still
          # a copy of a minute or two, which is the point.
          SAKSAMA_SCALE_GB: "1"
          PATH: /tmp/ghost:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: go test -tags=integration -count=1 -timeout 40m -v -run TestProductionShapeCopy ./test/integration/

      - name: Disk after the run
        if: always()
        run: df -h / | tail -1

      - name: Container logs when it fails
        if: failure()
        run: docker logs mysql-scale --tail 100 || true
