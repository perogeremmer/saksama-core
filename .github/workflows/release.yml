name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A dispatched run releases the tag that was typed, not whatever the default
          # branch happens to point at. The input existed before this line and did
          # nothing, which is the kind of quiet lie this repository tries not to tell.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A tag is only worth publishing if the tree it points at passes.
      - name: Test before publishing
        run: |
          go test ./...
          test -z "$(gofmt -l .)" || { echo "unformatted:"; gofmt -l .; exit 1; }
          go vet ./...

      - name: Build check
        run: |
          make build
          ./bin/saksama version
          # The published binaries must be static: that is what makes one file work on
          # a Debian box, a Fedora box, and Alpine's musl without a runtime to install.
          case "$(file -b bin/saksama)" in
            *"statically linked"*) echo "statically linked" ;;
            *) echo "::error::the release build is not statically linked"; exit 1 ;;
          esac
          ldd bin/saksama 2>&1 | grep -q "not a dynamic executable" || {
            echo "::error::the release build has dynamic dependencies"; ldd bin/saksama; exit 1; }

      # The config names syft as the SBOM generator; without it here the release
      # fails after the archives are already built.
      - name: Install syft for the SBOM step
        uses: anchore/sbom-action/download-syft@v0

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Most people installing this do not have a Go toolchain, and the one-liner
      # in the README is the only thing standing between the release and them. Run
      # it against the assets that were just published, so "the documented command
      # works" is a fact about this release rather than a memory of an older one.
      - name: The documented install one-liner installs this release
        run: |
          tag="${{ github.event.inputs.tag || github.event.ref }}"
          tag="${tag#refs/tags/}"
          version="${tag#v}"
          for attempt in $(seq 1 30); do
            if curl -fsSL -o /dev/null "https://github.com/perogeremmer/saksama-core/releases/download/$tag/checksums.txt"; then
              break
            fi
            echo "assets not published yet (attempt $attempt)"; sleep 10
          done
          SAKSAMA_VERSION="$version" SAKSAMA_INSTALL_DIR="$RUNNER_TEMP/sk-install" sh install.sh
          got=$("$RUNNER_TEMP/sk-install/saksama" version | awk '{print $2}')
          test "$got" = "$version" || { echo "::error::installed $got, expected $version"; exit 1; }
