name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      # A tag is only worth publishing if the tree it points at passes.
      - name: Test before publishing
        run: |
          go test ./...
          test -z "$(gofmt -l .)" || { echo "unformatted:"; gofmt -l .; exit 1; }
          go vet ./...

      - name: Build check
        run: make build && ./bin/saksama version

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
