name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build static binary
        run: make build

      # This step's name used to be the only thing that mentioned static linking: it
      # printed `file` and asserted nothing. "Runs on any distro" rests entirely on
      # that property, so it is checked rather than described.
      - name: Binary is static
        run: |
          make build
          file bin/saksama
          ./bin/saksama version
          case "$(file -b bin/saksama)" in
            *"statically linked"*) echo "file says: statically linked" ;;
            *) echo "::error::the binary is not statically linked"; exit 1 ;;
          esac
          if ldd bin/saksama 2>&1 | grep -q "not a dynamic executable"; then
            echo "ldd: no dynamic dependencies"
          else
            echo "::error::ldd found dynamic dependencies; a distro without them will not run this"
            ldd bin/saksama || true
            exit 1
          fi

  # A static binary makes the tool portable; the advice is not portable. The Perl
  # modules pt-osc needs are libdbd-mysql-perl on Debian and perl-DBD-MySQL on
  # Fedora, and printing an apt-get line on Fedora is advice nobody can follow. This
  # job runs the shipped binary on three other distributions and checks that
  # `engine doctor` names the package manager that is actually there.
  distro-smoke:
    name: Distro smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "archlinux:latest", "alpine:latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build a static binary
        run: CGO_ENABLED=0 go build -trimpath -o bin/saksama ./cmd/saksama

      - name: The binary runs, and the advice matches the distribution
        run: |
          docker run --rm -v "$PWD/bin/saksama:/saksama:ro" --entrypoint sh "${{ matrix.image }}" -c '
            set -e
            /saksama version
            # `engine doctor` exits 1 when something is missing - that is its job -
            # so the substitution must not trip `set -e`.
            out=$(/saksama engine doctor pt-osc 2>&1 || true)
            echo "$out"
            id=$(sed -n "s/^ID=//p" /etc/os-release | tr -d "\"\047")
            # The verb differs too: dnf installs, pacman -S, apk add.
            case "$id" in
              fedora|rhel|centos) pm="dnf";  want="dnf install" ;;
              arch)               pm="pacman"; want="pacman -S" ;;
              alpine)             pm="apk";  want="apk add" ;;
              *) echo "unexpected ID ${id} in this job"; exit 1 ;;
            esac
            if ! echo "$out" | grep -qF "$want"; then
              echo "expected \"${want}\" in the advice, got none"
              exit 1
            fi
            if echo "$out" | grep -q "apt-get"; then
              echo "apt-get advice on ${id}"
              exit 1
            fi
            echo "ok: ${pm} advice on ${id}"
          '

  integration:
    name: Integration (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: shop
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 60); do
            if docker exec "$(docker ps -qf ancestor=mysql:${{ matrix.mysql }})" mysqladmin ping -uroot --silent 2>/dev/null; then
              echo "ready"; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"; exit 1

      - name: Integration tests
        env:
          SAKSAMA_TEST_DSN: "root:@tcp(127.0.0.1:33306)/"
        run: go test -tags=integration -count=1 ./test/integration/ -v

  ptosc:
    name: pt-osc against a real binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The toolkit is not needed. pt-online-schema-change is one Perl file, and
      # installing the whole percona-toolkit package pulls a large tree of tools
      # this project never calls.
      - name: Install perl, DBD::mysql, and the single pt-osc script
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbi-perl libdbd-mysql-perl
          sudo curl -fsSL -o /usr/local/bin/pt-online-schema-change \
            https://raw.githubusercontent.com/percona/percona-toolkit/v3.7.2/bin/pt-online-schema-change
          sudo chmod +x /usr/local/bin/pt-online-schema-change
          pt-online-schema-change --version

      - name: Start MySQL
        run: |
          docker run -d --name mysql-ptosc \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=1 \
            -e MYSQL_DATABASE=shop \
            -p 33306:3306 mysql:8.4 --max-connections=200
          for i in $(seq 1 90); do
            if docker exec mysql-ptosc mysql -h127.0.0.1 -P3306 -uroot --silent -e "SELECT 1" >/dev/null 2>&1; then
              echo ready; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"; exit 1

      - name: Integration tests, including the copy engines
        env:
          SAKSAMA_TEST_DSN: "root:@tcp(127.0.0.1:33306)/"
        run: go test -tags=integration -count=1 -v ./test/integration/


  # The claims checks: what docs/COMPATIBILITY.md says must hold somewhere.
  # Refusals are cheap; the 5.7 suite is a full run against a real 5.7 server.
  claims:
    name: Claim checks (5.6 verified with its caveat, MariaDB refused)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start MySQL 5.7 with binlog and gh-ost's metadata instrument
        run: |
          docker run -d --name mysql-57 \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=1 \
            -e MYSQL_DATABASE=shop \
            -p 33308:3306 \
            mysql:5.7 \
            --log-bin=mysql-bin --server-id=1 --binlog-format=ROW \
            --performance-schema-instrument='wait/lock/metadata/sql/mdl=ON'
          for i in $(seq 1 90); do
            if docker exec mysql-57 mysql -h127.0.0.1 -P3306 -uroot --silent -e "SELECT 1" >/dev/null 2>&1; then
              echo ready; exit 0
            fi
            sleep 2
          done
          echo "MySQL 5.7 did not become ready"; exit 1

      # 5.6 gets binary logging for the same reason 5.7 does: the suite has to
      # exercise gh-ost, not just pt-osc. A 5.6 box with log_bin off is the other
      # real production state, and there the right answer is pt-osc; the routing
      # test asserts whichever answer this server's own log_bin value implies.
      - name: Start MySQL 5.6
        run: |
          docker run -d --name mysql-56 \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=1 \
            -e MYSQL_DATABASE=shop \
            -p 33309:3306 mysql:5.6 \
            --log-bin=mysql-bin --server-id=1 --binlog-format=ROW --skip-ssl
          for i in $(seq 1 60); do
            if docker exec mysql-56 mysql -h127.0.0.1 -P3306 -uroot --silent -e "SELECT 1" >/dev/null 2>&1; then
              echo ready; exit 0
            fi
            sleep 2
          done
          echo "MySQL 5.6 did not become ready"; exit 1

      - name: Start MariaDB 10.11
        run: |
          docker run -d --name mariadb-1011 \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=1 \
            -e MYSQL_DATABASE=shop \
            -p 33310:3306 mariadb:10.11
          for i in $(seq 1 60); do
            if docker exec mariadb-1011 mariadb-admin ping -h127.0.0.1 -uroot --silent >/dev/null 2>&1; then
              echo ready; exit 0
            fi
            sleep 2
          done
          echo "MariaDB did not become ready"; exit 1

      - name: Create the tables the refusal plans read
        run: |
          docker exec mysql-56 mysql -uroot shop \
            -e "CREATE TABLE kept_table (id bigint unsigned NOT NULL AUTO_INCREMENT PRIMARY KEY, a int NOT NULL)"
          docker exec mariadb-1011 mariadb -uroot shop \
            -e "CREATE TABLE kept_table (id bigint unsigned NOT NULL AUTO_INCREMENT PRIMARY KEY, a int NOT NULL)"

      - name: Install the single pt-osc script
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbi-perl libdbd-mysql-perl
          sudo curl -fsSL -o /usr/local/bin/pt-online-schema-change \
            https://raw.githubusercontent.com/percona/percona-toolkit/v3.7.2/bin/pt-online-schema-change
          sudo chmod +x /usr/local/bin/pt-online-schema-change

      - name: Download gh-ost 1.1.11
        run: |
          curl -fsSL -o /tmp/gh-ost.tgz \
            https://github.com/github/gh-ost/releases/download/v1.1.11/gh-ost-linux-amd64.tar.gz
          mkdir -p /tmp/ghost && tar xzf /tmp/gh-ost.tgz -C /tmp/ghost
          chmod +x /tmp/ghost/gh-ost
          /tmp/ghost/gh-ost --version

      # 5.6 is the supported floor, and the caveat is part of the contract: the
      # metadata lock queue cannot be read there, so every 5.6 plan must say it,
      # and a production run must block until the operator accepts the risk.
      - name: MySQL 5.6 plans, with the unobservable lock queue stated
        run: |
          make build
          ./bin/saksama plan --live -h 127.0.0.1 -P 33309 -u root -d shop -t kept_table \
            -a "ADD INDEX ix (a)" --tls false --json > /tmp/56.json
          jq -e '.recommendation.blocked == false' /tmp/56.json
          jq -e '[.checks[] | select(.id == "E5b" and .severity == "WARN")] | length == 1' /tmp/56.json
          jq -e '[.checks[] | select(.id == "E5")] | length == 0' /tmp/56.json

      - name: MySQL 5.6 production run blocks until the lock queue risk is accepted
        run: |
          set +e
          ./bin/saksama plan --live -h 127.0.0.1 -P 33309 -u root -d shop -t kept_table \
            -a "ADD INDEX ix (a)" --tls false --production --json > /tmp/56p.json
          code=$?
          set -e
          test "$code" -eq 1
          jq -e '[.checks[] | select(.id == "E5b" and .severity == "BLOCKER")] | length == 1' /tmp/56p.json

          ./bin/saksama plan --live -h 127.0.0.1 -P 33309 -u root -d shop -t kept_table \
            -a "ADD INDEX ix (a)" --tls false --production --accept-unknown-mdl --json > /tmp/56a.json
          jq -e '[.checks[] | select(.id == "E5b" and .severity == "BLOCKER")] | length == 0' /tmp/56a.json

      - name: MySQL 5.6 runs the whole integration suite, with a real gh-ost
        env:
          SAKSAMA_TEST_DSN: "root:@tcp(127.0.0.1:33309)/"
          PATH: /tmp/ghost:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          go test -tags=integration -count=1 -v ./test/integration/

      - name: MariaDB is refused by E1, not by an introspection crash
        run: |
          set +e
          ./bin/saksama plan --live -h 127.0.0.1 -P 33310 -u root -d shop -t kept_table \
            -a "ADD INDEX ix (a)" --json > /tmp/mdb.json
          code=$?
          set -e
          test "$code" -eq 1
          jq -e '[.checks[] | select(.id == "E1" and .severity == "BLOCKER")] | length == 1' /tmp/mdb.json

      - name: MySQL 5.7 runs the full suite with real copy engines
        env:
          SAKSAMA_TEST_DSN: "root:@tcp(127.0.0.1:33308)/"
          PATH: /tmp/ghost:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          go test -tags=integration -count=1 -v ./test/integration/

  # install.sh is the only install path for people without a Go toolchain, so its
  # failure modes matter more than its success path. Run it against a local mirror
  # (curl accepts file://) to prove that a clean archive installs, and that a
  # tampered archive or a missing checksums.txt refuses - forever, on every push,
  # without touching GitHub.
  install-script:
    name: Install script (clean, tampered, missing checksums)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build a mirror from the binary this commit produces
        run: |
          set -eu
          make build
          version=$(./bin/saksama version | awk '{print $2}')
          echo "SAKSAMA_TEST_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/mirror"
          tar czf "$RUNNER_TEMP/mirror/saksama_${version}_linux_amd64.tar.gz" -C bin saksama
          (cd "$RUNNER_TEMP/mirror" && sha256sum "saksama_${version}_linux_amd64.tar.gz" > checksums.txt)

      - name: A clean archive installs and runs
        run: |
          set -eu
          SAKSAMA_BASE_URL="file://$RUNNER_TEMP/mirror" SAKSAMA_VERSION="$SAKSAMA_TEST_VERSION" \
            SAKSAMA_INSTALL_DIR="$RUNNER_TEMP/good" sh install.sh
          got=$("$RUNNER_TEMP/good/saksama" version | awk '{print $2}')
          test "$got" = "$SAKSAMA_TEST_VERSION" || { echo "::error::installed $got"; exit 1; }

      - name: A tampered archive is refused before it is unpacked
        run: |
          set -eu
          printf 'x' >> "$RUNNER_TEMP/mirror/saksama_${SAKSAMA_TEST_VERSION}_linux_amd64.tar.gz"
          set +e
          output=$(SAKSAMA_BASE_URL="file://$RUNNER_TEMP/mirror" SAKSAMA_VERSION="$SAKSAMA_TEST_VERSION" \
            SAKSAMA_INSTALL_DIR="$RUNNER_TEMP/bad" sh install.sh 2>&1)
          code=$?
          set -e
          test "$code" -ne 0 || { echo "::error::install.sh accepted a tampered archive"; exit 1; }
          echo "$output" | grep -q "checksum mismatch" || { echo "::error::the refusal did not name the checksum"; echo "$output"; exit 1; }
          test ! -e "$RUNNER_TEMP/bad/saksama" || { echo "::error::a tampered binary was installed"; exit 1; }

      - name: A release without checksums is refused
        run: |
          set -eu
          rm -f "$RUNNER_TEMP/mirror/checksums.txt"
          set +e
          output=$(SAKSAMA_BASE_URL="file://$RUNNER_TEMP/mirror" SAKSAMA_VERSION="$SAKSAMA_TEST_VERSION" \
            SAKSAMA_INSTALL_DIR="$RUNNER_TEMP/nosum" sh install.sh 2>&1)
          code=$?
          set -e
          test "$code" -ne 0 || { echo "::error::install.sh installed without a checksum"; exit 1; }
          echo "$output" | grep -q "no checksums.txt" || { echo "::error::the refusal did not say why"; echo "$output"; exit 1; }

  # The INSTANT boundary. 8.0.28 and 8.0.29 do not agree about ADD COLUMN in the
  # middle of a row, or about DROP COLUMN, and the capability matrix has a row for
  # each side. One test, two pinned servers, both must match the matrix: a row
  # nobody runs against a real server is a guess with a rule id attached.
  instant-boundary:
    name: INSTANT boundary (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0.28", "8.0.29"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start MySQL ${{ matrix.mysql }}
        run: |
          docker run -d --name mysql-instant \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=1 \
            -e MYSQL_DATABASE=shop \
            -p 33306:3306 mysql:${{ matrix.mysql }} --skip-ssl
          for i in $(seq 1 90); do
            if docker exec mysql-instant mysql -h127.0.0.1 -P3306 -uroot --silent -e "SELECT 1" >/dev/null 2>&1; then
              echo ready; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"; exit 1

      # A tag moving under us would quietly turn this job into a duplicate of the
      # other one, so the version is asserted rather than assumed.
      - name: The server is the version this job claims
        run: |
          v=$(docker exec mysql-instant mysql -uroot -N -B -e "SELECT VERSION()")
          echo "server: $v"
          case "$v" in
            "${{ matrix.mysql }}"*) ;;
            *) echo "expected ${{ matrix.mysql }}, got $v"; exit 1 ;;
          esac

      - name: The matrix matches what this server actually does
        env:
          SAKSAMA_TEST_DSN: "root:@tcp(127.0.0.1:33306)/"
        run: go test -tags=integration -count=1 -v -run 'TestInstant' ./test/integration/

  # The flag probe: what the wrappers emit must exist in the engine binaries.
  # A copy engine exits non-zero on one unknown flag, so a wrong spelling is a
  # whole-run failure at production time; here it is a whole-run failure at CI
  # time instead. The stubs used elsewhere accept anything, which is exactly how
  # a wrong flag once shipped, so this job runs against real binaries.
  flag-matrix:
    name: Engine flag matrix (flags emitted are flags known)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download gh-ost 1.1.11
        run: |
          curl -fsSL -o /tmp/gh-ost.tgz \
            https://github.com/github/gh-ost/releases/download/v1.1.11/gh-ost-linux-amd64.tar.gz
          mkdir -p /tmp/ghost && tar xzf /tmp/gh-ost.tgz -C /tmp/ghost
          chmod +x /tmp/ghost/gh-ost

      - name: Install perl, DBD::mysql, and the single pt-osc script
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbi-perl libdbd-mysql-perl
          sudo curl -fsSL -o /usr/local/bin/pt-online-schema-change \
            https://raw.githubusercontent.com/percona/percona-toolkit/v3.7.2/bin/pt-online-schema-change
          sudo chmod +x /usr/local/bin/pt-online-schema-change

      - name: Every flag the wrappers emit must be known to the binaries
        env:
          SAKSAMA_GH_OST_BIN: /tmp/ghost/gh-ost
          SAKSAMA_PT_OSC_BIN: /usr/local/bin/pt-online-schema-change
        run: go test -tags=probe -count=1 -v ./internal/engine/copyeng/


  # The release config is code, and it was wrong for a whole release: the tag
  # produced an empty release because goreleaser could not parse one key. Nothing
  # validated the file until a maintainer pushed a tag, which is the worst time to
  # find out. A snapshot runs the same binaries, archives, checksums and SBOM
  # generation, but publishes nothing.
  release-config:
    name: Release config (snapshot build, nothing published)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install syft for the SBOM step
        uses: anchore/sbom-action/download-syft@v0

      - name: Validate the configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      - name: Build a snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: The snapshot binary is static
        run: |
          bin=$(ls -d dist/*linux_amd64*/saksama 2>/dev/null | head -1)
          test -n "$bin" || { echo "no linux_amd64 binary in dist/"; ls -R dist | head -20; exit 1; }
          file "$bin"
          case "$(file -b "$bin")" in
            *"statically linked"*) echo "statically linked" ;;
            *) echo "::error::$bin is not statically linked"; exit 1 ;;
          esac

      - name: The snapshot must be usable
        run: |
          ls -1 dist/*.tar.gz
          ls -1 dist/checksums.txt
          test "$(ls -1 dist/*.tar.gz | wc -l)" -eq 4
          mkdir -p /tmp/relcheck
          tar xzf "$(ls -1 dist/*linux_amd64.tar.gz)" -C /tmp/relcheck
          /tmp/relcheck/saksama version
          cd /tmp/relcheck && sha256sum -c "$OLDPWD/dist/checksums.txt" --ignore-missing 2>/dev/null || true

  offline-demo:
    name: Offline plan demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Native plan must succeed
        run: |
          make build
          ./bin/saksama plan --ddl testdata/orders.sql \
            --alter "ADD INDEX ix_created (created_at)" \
            --mysql-version 8.0.36 --json | jq -e '.recommendation.blockers == 0'

      # A rebuild on a table with foreign keys is not a dead end: gh-ost cannot do
      # it, pt-osc can. The plan must say pt-osc and must not refuse.
      - name: Rebuild with foreign keys must route to pt-osc
        run: |
          ./bin/saksama plan --ddl testdata/orders.sql \
            --alter "MODIFY COLUMN status varchar(64) NOT NULL" \
            --mysql-version 8.0.36 --json > /tmp/routed.json
          jq -e '.recommendation.blocked == false' /tmp/routed.json
          jq -e '.recommendation.engine == "pt-osc"' /tmp/routed.json
          jq -e '.engines[] | select(.engine == "gh-ost") | .verdict == "unsuitable"' /tmp/routed.json

      # An impossible change must still be refused, and with a non-zero exit that a
      # pipeline can gate on. A TEXT column cannot be indexed without a prefix.
      - name: Impossible change must be refused
        run: |
          set +e
          ./bin/saksama plan --ddl testdata/orders.sql \
            --alter "ADD INDEX ix_note (note)" \
            --mysql-version 8.0.36 --json > /tmp/blocked.json
          code=$?
          set -e
          test "$code" -eq 1
          jq -e '.recommendation.blocked == true' /tmp/blocked.json
          jq -e '[.checks[] | select(.severity == "BLOCKER")] | length > 0' /tmp/blocked.json
